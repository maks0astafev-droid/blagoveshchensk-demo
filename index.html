<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Пространственная модель Благовещенска</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-draw/dist/leaflet.draw.css" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <button id="mobile-toggle-sidebar" class="mobile-panel-btn left">☰ Модели</button>
  <button id="mobile-toggle-analysis" class="mobile-panel-btn right">Анализ ☰</button>

  <div id="sidebar">
    <button id="toggle-sidebar" class="panel-toggle">‹</button>

    <h2>Пространственная модель туризма г.Благовещенск</h2>

    <div id="layer-menu">
      <h3>Модели</h3>
      <div id="layer-controls">Загрузка моделей...</div>
    </div>

    <div id="content">
      Нажмите на полигон
    </div>
  </div>

  <div id="analysis-panel">
    <button id="toggle-analysis" class="panel-toggle right">›</button>

    <h2>Анализ участка</h2>

    <button id="clear-selection-btn">Очистить выделение</button>

    <div id="analysis-status">
      Нарисуйте полигон, линию или точку на карте.
    </div>

    <div id="analysis-results"></div>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-draw/dist/leaflet.draw.js"></script>
  <script src="https://unpkg.com/@turf/turf/turf.min.js"></script>
  <script src="script.js"></script>

</body>
</html>
